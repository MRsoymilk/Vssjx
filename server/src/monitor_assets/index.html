<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vssjx · 服务监控</title><link rel="stylesheet" href="/dashboard.css"><script src="/dashboard.js" defer></script></head>
<body><header><div><p class="eyebrow">VSSJX · OPERATIONS</p><h1>服务监控</h1><p>只读 · 本机访问 · 每 5 秒刷新</p></div><div><span id="health" class="badge">连接中</span><button id="refresh" type="button">立即刷新</button></div></header>
<main><p id="notice" role="status">正在获取状态…</p><section id="cards" class="cards" aria-label="服务概况"></section>
<section class="panel"><h2>近期趋势 <small>仅当前浏览器保留最近 5 分钟</small></h2><div id="trend" class="trend" aria-label="在线人数趋势"></div><p id="rates"></p></section>
<div class="columns"><section class="panel"><h2>同步与连接</h2><dl id="world"></dl></section><section class="panel"><h2>数据库与日志</h2><dl id="database"></dl></section></div>
<section class="panel"><h2>HTTP 请求 <small>自进程启动累计；延迟不包含 WebSocket 生命周期</small></h2><div class="scroll"><table><thead><tr><th>接口</th><th>请求</th><th>4xx</th><th>5xx</th><th>平均 ms</th><th>p95 桶上界 ms</th><th>最大 ms</th></tr></thead><tbody id="http"></tbody></table></div></section>
<section class="panel"><h2>最近异常 <small>最多 100 条，不含请求或聊天正文</small></h2><div class="scroll"><table><thead><tr><th>时间</th><th>类型</th><th>错误码</th><th>关联 ID</th></tr></thead><tbody id="events"></tbody></table></div></section>
<footer id="footer"></footer></main></body></html>
