map $http_upgrade $vssjx_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/vssjx-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vssjx-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vssjx_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ~ /\. { return 404; }
    location ~ "^/assets/[a-f0-9]{16}/" {
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        gzip_static on;
        gzip_vary on;
        try_files $uri $uri/ =404;
    }
}
