<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0b131a; color: #eee6cc; font-family: sans-serif; }
    body { height: var(--game-visible-height, 100dvh); display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow: hidden; }
    #frame { position: relative; flex: 0 0 auto; width: min(100%, calc((var(--game-visible-height, 100dvh) - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 2 / 3)); aspect-ratio: 2 / 3; }
    #canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; outline: none; touch-action: none; }
    #loading { position: absolute; inset: 0; background: #0b131a; display: flex; gap: 16px; padding: 20px; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
    #start { padding: 12px 28px; font-size: 18px; cursor: pointer; }
    #progress { width: 80%; height: 10px; accent-color: #c6b466; }
    #details { font-size: 14px; line-height: 1.6; color: #cfccbc; }
    footer { height: 48px; padding: 4px 10px; max-width: 600px; font-size: 11px; text-align: center; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="frame">
    <canvas id="canvas" width="640" height="960" tabindex="0">此浏览器不支持游戏画布。</canvas>
    <section id="loading"><button id="start">开始游戏</button><div id="notice">首次加载需要下载游戏资源。</div><progress id="progress" hidden></progress><div id="details" aria-live="polite"></div></section>
  </main>
  <footer>离线进度仅存于本站浏览器；清除站点数据会丢失。关闭前请在游戏内保存。联机需要本站部署游戏服务。</footer>
  <script src="$GODOT_URL"></script>
  <script>
    'use strict';
    const config = $GODOT_CONFIG;
    // Fixed portrait render surface; CSS fits it without stretching or cropping.
    config.canvasResizePolicy = 0;
    const engine = new Engine(config);
    const start = document.getElementById('start');
    const notice = document.getElementById('notice');
    const progress = document.getElementById('progress');
    const details = document.getElementById('details');
    let started = false;
    start.addEventListener('click', async () => {
      if (started) { window.location.reload(); return; }
      started = true;
      start.disabled = true;
      start.textContent = '加载中';
      notice.textContent = '正在连接资源服务器……';
      progress.hidden = false;
      progress.removeAttribute('value');
      let loaded = 0;
      let total = 0;
      let lastProgress = performance.now();
      let initializing = false;
      const megabytes = value => (value / 1048576).toFixed(1) + ' MB';
      const renderProgress = () => {
        const stalled = performance.now() - lastProgress > 20000;
        notice.textContent = initializing ? '下载完成，正在启动游戏……' : (stalled ? '网络较慢，正在等待资源继续传输……' : '正在下载游戏资源……');
        details.textContent = total > 0 ? '已加载 ' + megabytes(loaded) + ' / ' + megabytes(total) : (loaded > 0 ? '已加载 ' + megabytes(loaded) : '首次加载可能需要一些时间。');
        if (stalled) details.textContent += initializing ? ' 初始化用时较长，可重新加载。' : ' 已有20秒没有新的加载进度，可继续等待或重新加载。';
        start.disabled = !stalled;
        start.textContent = stalled ? '重新加载' : '加载中';
      };
      const timer = setInterval(renderProgress, 1000);
      const stopped = message => {
        clearInterval(timer);
        document.getElementById('loading').style.display = 'flex';
        notice.textContent = message;
        details.textContent = '请检查网络后重试。重新加载不会清除本站存档。';
        progress.hidden = true;
        start.disabled = false;
        start.textContent = '重新加载';
      };
      try {
        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length) throw new Error('浏览器缺少功能：' + missing.join(', '));
        await engine.startGame({ canvas: document.getElementById('canvas'),
          onProgress: (current, expected) => {
            if (current !== loaded) lastProgress = performance.now();
            loaded = current;
            total = expected;
            initializing = total > 0 && loaded >= total;
            if (total > 0) { progress.max = total; progress.value = loaded; }
            else progress.removeAttribute('value');
            renderProgress();
          },
          onExit: () => stopped('游戏已停止，请重新加载。')
        });
        clearInterval(timer);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('canvas').focus();
      } catch (error) {
        stopped('启动失败：' + (error.message || String(error)));
      }
    });
    // No unload-time save promise: an IndexedDB completion cannot be awaited here.
    window.addEventListener('pagehide', () => document.activeElement?.blur());
  </script>
</body>
</html>
