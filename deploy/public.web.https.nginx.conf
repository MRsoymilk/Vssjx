map $http_upgrade $vssjx_connection_upgrade {
    default upgrade;
    '' close;
}

# Closed route IDs only: no IP, raw URL, query, referrer, user agent or credentials.
# $uri follows internal index resolution, so root fallback is a game page, not PV.
map $uri $vssjx_portal_route {
    default "";
    /navigation/index.html portal;
    /navigation.html portal;
    /webgame/ game;
    /webgame/index.html game;
    /index.html game;
    /go/webgame web_click;
    /go/android android_click;
    /downloads/vssjx-arm64.apk apk;
    /webgame/downloads/vssjx-arm64.apk apk;
}
map "$request_method:$vssjx_portal_route" $vssjx_portal_log {
    default 0;
    ~^GET:.+ 1;
}
log_format vssjx_portal_event escape=json
    'VSSJX_PORTAL_V1 {"id":"$request_id","at":"$msec","route":"$vssjx_portal_route","status":$status,"bytes":$body_bytes_sent}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout vssjx_portal_event if=$vssjx_portal_log;
    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/vssjx-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vssjx-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vssjx_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Opt in by adding navigation/index.html to the existing export directory.
    # Without it, the original root game page remains available unchanged.
    location = / {
        try_files /navigation/index.html /index.html =404;
    }
    location = /navigation.html {
        try_files /navigation/index.html =404;
    }
    location /navigation/ {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Canonical trailing slash keeps the exported engine's relative URLs valid.
    location = /webgame {
        return 302 /webgame/$is_args$args;
    }
    # Fixed redirects measure entry requests without JS/cookies or open redirects.
    location = /go/webgame {
        return 302 /webgame/;
    }
    location = /go/android {
        return 302 /downloads/vssjx-arm64.apk;
    }
    location ~ /\. { return 404; }

    # Regex alias includes the captures explicitly. Missing files stay 404,
    # without immutable error caching or an HTML fallback masquerading as WASM.
    location ~ "^/webgame/(?<vssjx_game_asset>assets/[a-f0-9]{16}/[^/]+)$" {
        alias /usr/share/nginx/html/$vssjx_game_asset;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /webgame/ {
        alias /usr/share/nginx/html/;
        index index.html;
        gzip_static on;
        gzip_vary on;
    }

    # Reserved until a separately verified Flarum service is explicitly enabled.
    location = /flarum { return 404; }
    location ^~ /flarum/ { return 404; }

    # Keep all old URLs for already-open clients, direct index.html and APKs.
    location ~ "^/assets/[a-f0-9]{16}/" {
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        gzip_static on;
        gzip_vary on;
        try_files $uri $uri/ =404;
    }
}
