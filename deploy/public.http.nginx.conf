# Bootstrap only: serve ACME challenges before the first certificate exists.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
