<section class="panel users-panel"><h2>操作记录</h2><p>拒绝记录是排查线索，不代表已经作弊；可从用户详情进入指定账号的记录。</p><form id="audit-filter" class="user-toolbar"><label for="audit-account">账号 ID</label><input id="audit-account" maxlength="36" placeholder="留空查看全部账号"><button type="submit">应用账号</button><label for="audit-character">角色</label><select id="audit-character" disabled><option value="">全部角色 / 账号操作</option></select><label for="audit-outcome">结果</label><select id="audit-outcome"><option value="">全部</option><option value="rejected">拒绝 / 异常</option><option value="accepted">已执行</option><option value="replayed">重复请求</option><option value="observed">连接 / 移动汇总</option></select><button id="audit-all" type="button">查看所有用户</button><button id="audit-refresh" type="button">刷新记录</button></form>
<p id="audit-scope"></p><p id="audit-status" role="status"></p><div class="scroll"><table><thead><tr><th>时间 / 账号</th><th>动作</th><th>结果</th><th>操作与变更详情</th></tr></thead><tbody id="audit-list"></tbody></table></div><button id="audit-more" type="button" disabled>加载更早记录</button>
<p>只记录必要的安全信息，不记录密码、令牌或聊天正文。移动按时间窗口汇总，审计记录不会随服务重启清空。</p></section>
