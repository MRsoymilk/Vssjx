name: vssjx-forum

services:
  forum:
    image: ${FLARUM_IMAGE:?Set FLARUM_IMAGE to the reviewed forum image}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - type: bind
        source: ${FLARUM_STATE_DIR:?Set FLARUM_STATE_DIR to the initialized dedicated state directory}
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/apache2:size=2m,mode=755
      - /var/lock/apache2:size=2m,mode=755
    mem_limit: 384m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
